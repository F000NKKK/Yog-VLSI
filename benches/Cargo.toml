# Benchmarks of the redstone VM (`src/vm.rs`), built here as a plain
# library: `yog build` makes a cdylib-only crate that benches can't link
# against, and the VM needs nothing but std and serde.
#
#     cargo bench --manifest-path benches/Cargo.toml
[package]
name = "yog-vlsi-bench"
version = "0.0.0"
edition = "2024"
publish = false
autobenches = false

[lib]
name = "yog_vlsi_vm"
path = "../src/vm.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "vm"
harness = false

[workspace]
