[mod]
id          = "yog-vlsi"
name        = "@res:Strings.mod_name"
version     = "0.3.0"
description = "@res:Strings.mod_description"
authors     = ["F000NK", "Yog Team"]
license     = "AGPL-3.0-only"
edition     = "2024"

[network]
# The boards' screens ask the server for what to show and send it edits.
to_server = true

[dependencies]
base64     = "0.22"
miniz_oxide = "0.8"
uuid       = { version = "1", features = ["v4"] }
yog-api    = "0.109.0"
yog-kit    = "0.20.0"

[dependencies.exports]
yog-pipes = "0.14.0"
