[mod]
id          = "yog-vlsi"
name        = "@Strings.mod_name"
version     = "0.3.0"
description = "@Strings.mod_description"
authors     = ["F000NK", "Yog Team"]
license     = "AGPL-3.0-only"
edition     = "2024"

[dependencies]
base64     = "0.22"
miniz_oxide = "0.8"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4"] }
yog-api    = "0.101.0"
yog-kit    = "0.12.0"

[dependencies.exports]
yog-pipes = "0.10.0"
