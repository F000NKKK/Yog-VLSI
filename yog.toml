[mod]
id          = "yog-vlsi"
name        = "@Strings.mod_name"
version     = "0.3.0"
description = "@Strings.mod_description"
authors     = ["F000NK", "Yog Team"]
license     = "AGPL-3.0-only"
edition     = "2024"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4"] }
yog-api    = "0.93"
yog-kit    = "0.4"

[dependencies.exports]
yog-pipes = "0.5"

## `yog run <name>` — build, drop the .yog into the loader's own Gradle dev-run
# instance, then launch it.
[run.forge-1.21.1]
name       = "Forge 1.21.1"
export_dir = "../Yog-Mod-Loader/forge/run/yog-mods"
command    = "./gradlew"
args       = ["runClient", "-Pminecraft_version=1.21.1"]
cwd        = "../Yog-Mod-Loader/forge"
env        = ["JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64"]

[run.forge-1.20.1]
name       = "Forge 1.20.1"
export_dir = "../Yog-Mod-Loader/forge/run/yog-mods"
command    = "./gradlew"
args       = ["runClient", "-Pminecraft_version=1.20.1"]
cwd        = "../Yog-Mod-Loader/forge"
env        = ["JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"]

